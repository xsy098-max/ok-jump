name: Sync to CNB

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to CNB
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git remote add cnb https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/xsy098-max/ok-jump.git
          echo "Testing CNB access..."
          git ls-remote cnb 2>&1 || echo "ls-remote failed"
          echo "Pushing main..."
          git push cnb ${GITHUB_REF_NAME:-main} --force 2>&1
          echo "Pushing tags..."
          git push cnb --tags --force 2>&1 || true
